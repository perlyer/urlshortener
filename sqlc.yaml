version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/storage/query.sql"
    gen:
      go:
        package: "db"
        out: "internal/storage/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true
        rename:
          original_url: "OriginalURL"
